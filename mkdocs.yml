site_name: Grid Ops
site_description: >-
  Hybrid quantum-classical grid optimization — QAOA microgrid islanding on a
  Dell Pro Max GB10, with real DC power flow and measured simulation limits.
site_author: Ken Rollins
site_url: https://kenrollins.github.io/qaoa-grid-ops/
repo_url: https://github.com/kenrollins/qaoa-grid-ops
repo_name: kenrollins/qaoa-grid-ops
edit_uri: edit/main/site_src/
copyright: |
  &copy; 2026 Ken Rollins. Apache-2.0. A personal technical demonstrator, not an
  official Dell product or reference architecture.

# site_src, not docs/: docs/ also holds the internal review artefacts, which are
# useful in the repository and not intended as a public site. The build script
# copies the technical notes in, so they stay single-sourced.
docs_dir: site_src

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Required for the --8<-- figure includes. The figures are generated by
  # tools/build_site.py from the demo's own engine, so the published charts are
  # the same computation the live application runs.
  - pymdownx.snippets:
      base_path: ["site_src"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - stylesheets/extra.css

# Loaded site-wide, and served from this site rather than a CDN — the same
# vendored copy the application uses. A CDN would be one more host that a
# corporate or government network can block, and a blocked CDN means every
# chart silently renders as an empty box.
#
# mkdocs places this at the END of <body>, i.e. AFTER the inline figure scripts
# have already run, so tools/build_site.py gates each figure on the library
# being present rather than assuming load order.
extra_javascript:
  - js/plotly.min.js

nav:
  - Overview: index.md
  - The demonstration: demo.md
  - How it works: how-it-works.md
  - Why it needs this hardware: hardware.md
  - Technical notes:
      - notes/index.md
      - notes/01-what-qaoa-computes.md
      - notes/02-why-depth-can-hurt.md
      - notes/03-what-a-qubo-cannot-express.md
      - notes/04-noise-without-the-density-matrix.md
      - notes/05-which-method-which-machine.md
  - Architecture: architecture.md
  - Sources: sources.md
