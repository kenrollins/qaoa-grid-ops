site_name: QAOA Grid Ops
site_description: >-
  Hybrid quantum-classical grid optimization — QAOA microgrid islanding on a
  Dell Pro Max GB10, with real DC power flow and measured simulation limits.
site_author: Ken Rollins
site_url: https://kenrollins.github.io/qaoa-grid-ops/
repo_url: https://github.com/kenrollins/qaoa-grid-ops
repo_name: kenrollins/qaoa-grid-ops
edit_uri: edit/main/site_src/
copyright: |
  &copy; 2026 Ken Rollins. Apache-2.0. A personal exploration — not an official Dell
  product, reference architecture, or Dell position.
  <a href="https://kenrollins.github.io/qaoa-grid-ops/about/">Read the full disclaimer.</a>

# site_src, not docs/: docs/ also holds the internal review artefacts, which are
# useful in the repository and not intended as a public site. The build script
# copies the technical notes in, so they stay single-sourced.
docs_dir: site_src

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # Top tabs instead of one long left rail: the sections are peers, not a
    # reading order, and a customer should see the whole shape at a glance.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # Folds the page's table of contents INTO the left sidebar. Without this
    # there is a nav rail on the left and a second one on the right, and it is
    # not obvious which is which.
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    # NOT navigation.instant. It swaps pages by XHR, which does not re-run the
    # inline scripts that draw every figure on this site.
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Required for the --8<-- figure includes. The figures are generated by
  # tools/build_site.py from the demo's own engine, so the published charts are
  # the same computation the live application runs.
  - pymdownx.snippets:
      base_path: ["site_src"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - stylesheets/extra.css

# Loaded site-wide, and served from this site rather than a CDN — the same
# vendored copy the application uses. A CDN would be one more host that a
# corporate or government network can block, and a blocked CDN means every
# chart silently renders as an empty box.
#
# mkdocs places this at the END of <body>, i.e. AFTER the inline figure scripts
# have already run, so tools/build_site.py gates each figure on the library
# being present rather than assuming load order.
extra_javascript:
  - js/plotly.min.js

nav:
  - Home: index.md
  - Demonstration: demo.md
  - How It Works: how-it-works.md
  - Architecture: architecture.md
  - Hardware: hardware.md
  # HAND-MAINTAINED, and it has silently fallen behind before: build_site.py
  # copies every note in docs/journal/notes/, so a note omitted here is built
  # and published but reachable only from the Overview index. Add the row when
  # you add the note.
  - Technical Notes:
      - Overview: notes/index.md
      - 01 - What QAOA actually computes: notes/01-what-qaoa-computes.md
      - 02 - Why depth can hurt: notes/02-why-depth-can-hurt.md
      - 03 - What a QUBO cannot express: notes/03-what-a-qubo-cannot-express.md
      - 04 - Noise without the density matrix: notes/04-noise-without-the-density-matrix.md
      - 05 - Which method, which machine: notes/05-which-method-which-machine.md
      - 06 - Why emulation needs an experiment loop: notes/06-why-emulation-needs-an-experiment-loop.md
      - 07 - What the first Algorithm Lab slice proves: notes/07-what-the-first-algorithm-lab-slice-proves.md
      - 08 - Can emulation train a better QUBO: notes/08-can-emulation-train-a-better-qubo.md
      - 09 - Who owns the GB10 while a simulation runs: notes/09-who-owns-the-gb10.md
      - 10 - An owner-only hand on the GB10: notes/10-an-owner-only-hand-on-the-gb10.md
  - Sources: sources.md
  - About: about.md
